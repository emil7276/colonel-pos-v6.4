                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                            fontSize: 20,
                          ),
                        ),
                        Text('${s.time} • ${s.cashier}'),
                        const Divider(),
                        ...items.map(
                          (i) => ListTile(
                            dense: true,
                            title: Text(i['name'].toString()),
                            subtitle: Text('Qty ${i['qty']}'),
                            trailing: Text(
                              rp(
                                (i['price'] as int) *
                                    (i['qty'] as int),
