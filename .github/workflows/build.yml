          class BackupPage extends StatefulWidget {
            const BackupPage({super.key});

            @override
            State<BackupPage> createState() => _BackupPageState();
          }

          class _BackupPageState extends State<BackupPage> {
            bool working = false;

            Future<File> makeBackup() async {
              final data = await DB.backup();
              final dir = await getApplicationDocumentsDirectory();

              final file = File(
                join(
                  dir.path,
                  'colonel_pos_v64_backup_'
                  '${DateTime.now().millisecondsSinceEpoch}.json',
                ),
              );

              await file.writeAsString(
                const JsonEncoder.withIndent('  ').convert(data),
              );

              return file;
            }

            Future<void> backup() async {
              setState(() => working = true);

              try {
                final file = await makeBackup();

                await Share.shareXFiles(
                  [XFile(file.path)],
                  subject:
                      'Backup Colonel Fried Chicken POS V6.4',
                );
              } finally {
                if (mounted) setState(() => working = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Backup')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    const Card(
                      child: Padding(
                        padding: EdgeInsets.all(16),
                        child: Text(
                          'Backup menyimpan data transaksi, '
                          'menu, pengguna, dan stok dalam file '
                          'lokal JSON. File dapat dibagikan ke '
                          'HP lain, cloud storage, atau email '
                          'melalui menu berbagi Android.',
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    FilledButton.icon(
                      onPressed: working ? null : backup,
                      icon: const Icon(Icons.backup),
                      label: Text(
                        working
                            ? 'MEMBUAT BACKUP...'
                            : 'BACKUP DATA',
                      ),
                    ),
                    const SizedBox(height: 12),
                    const Text(
                      'Catatan: backup V6.4 menggunakan '
                      'penyimpanan lokal dan Android Share Sheet. '
                      'Restore database akan ditambahkan sebagai '
                      'fitur lanjutan setelah format backup '
                      'distabilkan.',
                    ),
                  ],
                ),
              );
            }
          }
          DART

      # Compatibility fixes for Flutter 3.29.2
      - name: Fix V6.4 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/lib/main.dart")
          s = p.read_text()

          # package:path exposes a type named Context.
          # Alias the package so it cannot conflict with Flutter BuildContext.
          s = s.replace(
              "import 'package:path/path.dart';",
              "import 'package:path/path.dart' as path;"
          )

          # Replace path functions with the aliased package.
          s = re.sub(r'(?<![\w.])join\(', 'path.join(', s)

          # Any accidental PDF/path Context parameter must be Flutter BuildContext.
          s = re.sub(
              r'(?<![\w.])Context\s+context\b',
              'BuildContext context',
              s
          )

          # Flutter 3.29.2 API compatibility.
          s = s.replace(
              "DropdownButtonFormField<String>(\n                              initialValue:",
              "DropdownButtonFormField<String>(\n                              value:"
          )

          s = s.replace(
              "DropdownButtonFormField<String>(\n                          initialValue:",
              "DropdownButtonFormField<String>(\n                          value:"
          )

          p.write_text(s)
          print("V6.4 compatibility fixes applied successfully.")
          PY

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze
        run: |
          cd app
          dart analyze lib/main.dart

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colonel-pos-v6.4-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
