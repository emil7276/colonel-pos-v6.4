          class QrisPage extends StatefulWidget {
            const QrisPage({super.key});

            @override
            State<QrisPage> createState() => _QrisPageState();
          }

          class _QrisPageState extends State<QrisPage> {
            String? imagePath;
            final merchant = TextEditingController();

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              imagePath = p.getString('qris_image');
              merchant.text =
                  p.getString('qris_merchant') ?? '';

              if (mounted) setState(() {});
            }

            Future<void> pick() async {
              final picker = ImagePicker();
              final image = await picker.pickImage(
                source: ImageSource.gallery,
                imageQuality: 90,
              );

              if (image == null) return;

              final dir = await getApplicationDocumentsDirectory();
              final target = File(
                join(dir.path, 'qris_image.jpg'),
              );

              await File(image.path).copy(target.path);

              final p = await SharedPreferences.getInstance();
              await p.setString('qris_image', target.path);

              if (!mounted) return;
              setState(() => imagePath = target.path);
            }

            Future<void> save() async {
              final p = await SharedPreferences.getInstance();
              await p.setString(
                'qris_merchant',
                merchant.text,
              );

              if (!mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(
                  content: Text('Data QRIS disimpan.'),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final file = imagePath == null
                  ? null
                  : File(imagePath!);

              return Scaffold(
                appBar: AppBar(title: const Text('QRIS')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
