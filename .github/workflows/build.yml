                        if (s.returned)
                          const ListTile(
                            leading: Icon(
                              Icons.warning,
                              color: Colors.red,
                            ),
                            title: Text('TRANSAKSI SUDAH DIRETUR'),
                          ),
                        Row(
                          children: [
                            Expanded(
                              child: OutlinedButton.icon(
                                onPressed: () async {
                                  Navigator.pop(context);
                                  await printReceipt(s);
                                },
                                icon: const Icon(Icons.print),
                                label: const Text('Cetak'),
                              ),
                            ),
                            if (widget.role == 'Administrator' &&
                                !s.returned) ...[
                              const SizedBox(width: 8),
                              Expanded(
                                child: FilledButton.icon(
                                  onPressed: () async {
                                    Navigator.pop(context);
                                    await authorizeReturn(s);
                                  },
                                  icon: const Icon(Icons.undo),
                                  label: const Text('Retur'),
                                  style: FilledButton.styleFrom(
