            Future<void> showComparison(
              String title,
              DateTime aStart,
              DateTime aEnd,
              DateTime bStart,
              DateTime bEnd,
              String aName,
              String bName,
            ) async {
              final a = await DB.omzet(aStart, aEnd);
              final b = await DB.omzet(bStart, bEnd);

              if (!mounted) return;

              await showDialog(
                context: context,
                builder: (_) => AlertDialog(
                  title: Text(title),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      ListTile(
                        title: Text(aName),
                        trailing: Text(rp(a)),
                      ),
                      ListTile(
                        title: Text(bName),
                        trailing: Text(rp(b)),
                      ),
                      const Divider(),
                      Text('Selisih nominal: ${rp(a - b)}'),
                    ],
                  ),
                  actions: [
                    FilledButton(
                      onPressed: () => Navigator.pop(context),
                      child: const Text('Tutup'),
                    ),
                  ],
                ),
              );
            }

            Future<void> _monthComparison() async {
              final n = DateTime.now();
              await showComparison(
                'Perbandingan Bulan',
                DateTime(n.year, n.month),
                DateTime(n.year, n.month + 1),
                DateTime(n.year, n.month - 1),
                DateTime(n.year, n.month),
                'Bulan ini',
                'Bulan sebelumnya',
              );
            }

            Future<void> _yearComparison() async {
              final n = DateTime.now();
              await showComparison(
                'Perbandingan Tahun',
                DateTime(n.year),
                DateTime(n.year + 1),
                DateTime(n.year - 1),
                DateTime(n.year),
                'Tahun ini',
                'Tahun sebelumnya',
              );
            }

            Future<void> _ramadanComparison() async {
              final n = DateTime.now();

              DateTime currentStart;
              DateTime currentEnd;
              DateTime previousStart;
              DateTime previousEnd;

              if (n.year == 2026) {
                currentStart = DateTime(2026, 2, 18);
                currentEnd = DateTime(2026, 3, 20);
                previousStart = DateTime(2025, 3, 1);
                previousEnd = DateTime(2025, 3, 31);
              } else {
                currentStart = DateTime(n.year, 3);
                currentEnd = DateTime(n.year, 4);
                previousStart = DateTime(n.year - 1, 3);
                previousEnd = DateTime(n.year - 1, 4);
              }

              await showComparison(
                'Ramadan',
                currentStart,
                currentEnd,
                previousStart,
                previousEnd,
                'Ramadan ${currentStart.year}',
                'Ramadan ${previousStart.year}',
              );
            }

