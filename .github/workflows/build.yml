                    ],
                  );

                  final cartPanel = Card(
                    child: Column(
                      children: [
                        const ListTile(
                          leading: Icon(Icons.shopping_cart),
                          title: Text(
                            'Keranjang',
                            style:
                                TextStyle(fontWeight: FontWeight.bold),
                          ),
                        ),
                        Expanded(
