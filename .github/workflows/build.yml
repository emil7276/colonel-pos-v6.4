name: Colonel Fried Chicken POS V6.4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms android --project-name colonel_pos_v64 app

      - name: Write pubspec.yaml
        run: |
          cat > app/pubspec.yaml <<'YAML'
          name: colonel_pos_v64
          description: Colonel Fried Chicken Professional POS V6.4
          publish_to: "none"
          version: 6.4.0+1

          environment:
            sdk: ">=3.7.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.4.2
            path: ^1.9.1
            shared_preferences: ^2.5.3
            share_plus: ^10.1.4
            path_provider: ^2.1.5
            image_picker: ^1.1.2
            pdf: ^3.11.3
            printing: ^5.14.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          YAML

      - name: Write main.dart
        run: |
          cat > app/lib/main.dart <<'DART'
          [MAIN_DART_V6_4_FIXED]
          DART

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze
        run: |
          cd app
          dart analyze lib/main.dart

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colonel-pos-v6.4-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
