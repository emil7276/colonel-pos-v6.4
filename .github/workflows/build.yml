name: Colonel Fried Chicken POS V6.4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms android --project-name colonel_pos_v64 app

      - name: Write pubspec.yaml
        run: |
          cat > app/pubspec.yaml <<'YAML'
          name: colonel_pos_v64
          description: Colonel Fried Chicken Professional POS V6.4
          publish_to: "none"
          version: 6.4.0+1

          environment:
            sdk: ">=3.7.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.4.2
            path: ^1.9.1
            shared_preferences: ^2.5.3
            share_plus: ^10.1.4
            path_provider: ^2.1.5
            image_picker: ^1.1.2
            pdf: ^3.11.3
            printing: ^5.14.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          YAML

      - name: Write main.dart
        run: |
          cat > app/lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:path/path.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:sqflite/sqflite.dart';

          const red = Color(0xFFD71920);
          const darkRed = Color(0xFF9E1117);
          const bg = Color(0xFFF5F5F5);

          const copyright1 = 'Copyright © CP Colonel Pos';
          const copyright2 = 'Hak cipta dilindungi Undang-Undang';

          String rp(num value) {
            final n = value.round().toString();
            final chars = n.split('');
            var out = '';
            for (var i = 0; i < chars.length; i++) {
              final pos = chars.length - i;
              out += chars[i];
              if (pos > 1 && pos % 3 == 1) out += '.';
            }
            return 'Rp$out';
          }

          String stamp() {
            final d = DateTime.now();
            String two(int n) => n.toString().padLeft(2, '0');
            return '${d.year}-${two(d.month)}-${two(d.day)} '
                '${two(d.hour)}:${two(d.minute)}:${two(d.second)}';
          }

          class DB {
            static Database? _db;

            static Future<Database> get database async {
              if (_db != null) return _db!;
              final dir = await getDatabasesPath();
              _db = await openDatabase(
                join(dir, 'colonel_pos_v64.db'),
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE products(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      name TEXT NOT NULL,
                      category TEXT NOT NULL,
                      price INTEGER NOT NULL,
                      stock INTEGER NOT NULL DEFAULT 0,
                      active INTEGER NOT NULL DEFAULT 1
                    )
                  ''');

                  await db.execute('''
                    CREATE TABLE users(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      username TEXT NOT NULL UNIQUE,
                      password TEXT NOT NULL,
                      role TEXT NOT NULL,
                      active INTEGER NOT NULL DEFAULT 1
                    )
                  ''');

                  await db.execute('''
                    CREATE TABLE sales(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      sale_no TEXT NOT NULL UNIQUE,
                      sale_time TEXT NOT NULL,
                      cashier TEXT NOT NULL,
                      subtotal INTEGER NOT NULL,
                      discount INTEGER NOT NULL,
                      total INTEGER NOT NULL,
                      cash INTEGER NOT NULL,
                      change_amount INTEGER NOT NULL,
                      payment TEXT NOT NULL,
                      returned INTEGER NOT NULL DEFAULT 0
                    )
                  ''');

                  await db.execute('''
                    CREATE TABLE sale_items(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      sale_id INTEGER NOT NULL,
                      product_id INTEGER,
                      name TEXT NOT NULL,
                      qty INTEGER NOT NULL,
                      price INTEGER NOT NULL
                    )
                  ''');

                  await db.execute('''
                    CREATE TABLE stock_logs(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      product_id INTEGER NOT NULL,
                      time TEXT NOT NULL,
                      type TEXT NOT NULL,
                      qty INTEGER NOT NULL,
                      note TEXT
                    )
                  ''');

                  await db.insert('users', {
                    'username': 'admin',
                    'password': '1234',
                    'role': 'Administrator',
                    'active': 1,
                  });

                  await db.insert('users', {
                    'username': 'kasir',
                    'password': '1234',
                    'role': 'Kasir',
                    'active': 1,
                  });

                  final products = [
                    ['Dada', 'Ayam', 12000],
                    ['Paha Atas', 'Ayam', 12000],
                    ['Paha Bawah', 'Ayam', 9000],
                    ['Sayap', 'Ayam', 9000],
                    ['Paket Dada', 'Paket', 15500],
                    ['Paket Paha Atas', 'Paket', 15500],
                    ['Paket Paha Bawah', 'Paket', 12500],
                    ['Paket Sayap', 'Paket', 12500],
                    ['Sambal Geprek', 'Tambahan', 3000],
                    ['Kentang Goreng', 'Tambahan', 8000],
                    ['Air Mineral', 'Minuman', 4000],
                    ['Es Teh', 'Minuman', 4000],
                  ];

                  for (final p in products) {
                    await db.insert('products', {
                      'name': p[0],
                      'category': p[1],
                      'price': p[2],
                      'stock': 0,
                      'active': 1,
                    });
                  }
                },
              );
              return _db!;
            }

            static Future<List<Map<String, dynamic>>> products() async {
              final db = await database;
              return db.query('products', orderBy: 'category,name');
            }

            static Future<List<Map<String, dynamic>>> users() async {
              final db = await database;
              return db.query('users', orderBy: 'username');
            }

            static Future<List<Map<String, dynamic>>> sales() async {
              final db = await database;
              return db.query('sales', orderBy: 'sale_time DESC');
            }

            static Future<Map<String, dynamic>?> login(
                String username, String password) async {
              final db = await database;
              final rows = await db.query(
                'users',
                where: 'username=? AND password=? AND active=1',
                whereArgs: [username, password],
                limit: 1,
              );
              return rows.isEmpty ? null : rows.first;
            }

            static Future<void> saveProduct({
              int? id,
              required String name,
              required String category,
              required int price,
              required int stock,
              required bool active,
            }) async {
              final db = await database;
              final data = {
                'name': name,
                'category': category,
                'price': price,
                'stock': stock,
                'active': active ? 1 : 0,
              };

              if (id == null) {
                await db.insert('products', data);
              } else {
                await db.update(
                  'products',
                  data,
                  where: 'id=?',
                  whereArgs: [id],
                );
              }
            }

            static Future<void> deleteProduct(int id) async {
              final db = await database;
              await db.update(
                'products',
                {'active': 0},
                where: 'id=?',
                whereArgs: [id],
              );
            }

            static Future<void> addStock(
                int productId, int qty, String note) async {
              if (qty <= 0) return;
              final db = await database;
              await db.transaction((txn) async {
                await txn.rawUpdate(
                  'UPDATE products SET stock=stock+? WHERE id=?',
                  [qty, productId],
                );
                await txn.insert('stock_logs', {
                  'product_id': productId,
                  'time': stamp(),
                  'type': 'MASUK',
                  'qty': qty,
                  'note': note,
                });
              });
            }

            static Future<String> nextSaleNo() async {
              final db = await database;
              final rows = await db.rawQuery(
                'SELECT id FROM sales ORDER BY id DESC LIMIT 1',
              );
              final next = rows.isEmpty ? 1 : (rows.first['id'] as int) + 1;
              return 'CFC-${next.toString().padLeft(6, '0')}';
            }

            static Future<int> createSale({
              required String cashier,
              required List<CartLine> items,
              required int subtotal,
              required int discount,
              required int total,
              required int cash,
              required int change,
              required String payment,
            }) async {
              final db = await database;

              return db.transaction<int>((txn) async {
                for (final line in items) {
                  final rows = await txn.query(
                    'products',
                    columns: ['stock'],
                    where: 'id=?',
                    whereArgs: [line.product.id],
                    limit: 1,
                  );

                  if (rows.isEmpty) {
                    throw Exception('Produk tidak ditemukan.');
                  }

                  final stock = rows.first['stock'] as int;
                  if (stock < line.qty) {
                    throw Exception(
                      'Stok ${line.product.name} tidak cukup. '
                      'Tersedia $stock.',
                    );
                  }
                }

                final no = await nextSaleNo();

                final saleId = await txn.insert('sales', {
                  'sale_no': no,
                  'sale_time': stamp(),
                  'cashier': cashier,
                  'subtotal': subtotal,
                  'discount': discount,
                  'total': total,
                  'cash': cash,
                  'change_amount': change,
                  'payment': payment,
                  'returned': 0,
                });

                for (final line in items) {
                  await txn.insert('sale_items', {
                    'sale_id': saleId,
                    'product_id': line.product.id,
                    'name': line.product.name,
                    'qty': line.qty,
                    'price': line.product.price,
                  });

                  await txn.rawUpdate(
                    'UPDATE products SET stock=stock-? WHERE id=?',
                    [line.qty, line.product.id],
                  );

                  await txn.insert('stock_logs', {
                    'product_id': line.product.id,
                    'time': stamp(),
                    'type': 'KELUAR',
                    'qty': line.qty,
                    'note': 'Penjualan $no',
                  });
                }

                return saleId;
              });
            }

            static Future<List<Map<String, dynamic>>> saleItems(
                int saleId) async {
              final db = await database;
              return db.query(
                'sale_items',
                where: 'sale_id=?',
                whereArgs: [saleId],
              );
            }

            static Future<void> returnSale(
                int saleId, String adminUser) async {
              final db = await database;

              await db.transaction((txn) async {
                final saleRows = await txn.query(
                  'sales',
                  where: 'id=?',
                  whereArgs: [saleId],
                  limit: 1,
                );

                if (saleRows.isEmpty) {
                  throw Exception('Transaksi tidak ditemukan.');
                }

                if (saleRows.first['returned'] == 1) {
                  throw Exception('Transaksi sudah diretur.');
                }

                final items = await txn.query(
                  'sale_items',
                  where: 'sale_id=?',
                  whereArgs: [saleId],
                );

                for (final item in items) {
                  final productId = item['product_id'];
                  final qty = item['qty'] as int;

                  if (productId != null) {
                    await txn.rawUpdate(
                      'UPDATE products SET stock=stock+? WHERE id=?',
                      [qty, productId],
                    );

                    await txn.insert('stock_logs', {
                      'product_id': productId,
                      'time': stamp(),
                      'type': 'RETUR',
                      'qty': qty,
                      'note': 'Retur oleh $adminUser',
                    });
                  }
                }

                await txn.update(
                  'sales',
                  {'returned': 1},
                  where: 'id=?',
                  whereArgs: [saleId],
                );
              });
            }

            static Future<List<Map<String, dynamic>>> bestSelling(
                DateTime from, DateTime to) async {
              final db = await database;
              return db.rawQuery('''
                SELECT name, SUM(qty) qty, SUM(qty*price) omzet
                FROM sale_items
                WHERE sale_id IN (
                  SELECT id FROM sales
                  WHERE sale_time >= ?
                    AND sale_time < ?
                    AND returned=0
                )
                GROUP BY name
                ORDER BY qty DESC
              ''', [from.toIso8601String(), to.toIso8601String()]);
            }

            static Future<List<Map<String, dynamic>>> hourly(
                DateTime from, DateTime to) async {
              final db = await database;
              return db.rawQuery('''
                SELECT substr(sale_time,12,2) jam,
                       COUNT(*) transaksi,
                       SUM(total) omzet
                FROM sales
                WHERE sale_time >= ?
                  AND sale_time < ?
                  AND returned=0
                GROUP BY jam
                ORDER BY transaksi DESC
              ''', [from.toIso8601String(), to.toIso8601String()]);
            }

            static Future<List<Map<String, dynamic>>> daily(
                DateTime from, DateTime to) async {
              final db = await database;
              return db.rawQuery('''
                SELECT substr(sale_time,1,10) tanggal,
                       COUNT(*) transaksi,
                       SUM(total) omzet
                FROM sales
                WHERE sale_time >= ?
                  AND sale_time < ?
                  AND returned=0
                GROUP BY tanggal
                ORDER BY transaksi DESC
              ''', [from.toIso8601String(), to.toIso8601String()]);
            }

            static Future<int> omzet(DateTime from, DateTime to) async {
              final db = await database;
              final rows = await db.rawQuery('''
                SELECT COALESCE(SUM(total),0) total
                FROM sales
                WHERE sale_time >= ?
                  AND sale_time < ?
                  AND returned=0
              ''', [from.toIso8601String(), to.toIso8601String()]);
              return (rows.first['total'] as num).toInt();
            }

            static Future<void> saveUser({
              int? id,
              required String username,
              required String password,
              required String role,
              required bool active,
            }) async {
              final db = await database;
              final data = {
                'username': username,
                'password': password,
                'role': role,
                'active': active ? 1 : 0,
              };

              if (id == null) {
                await db.insert('users', data);
              } else {
                await db.update(
                  'users',
                  data,
                  where: 'id=?',
                  whereArgs: [id],
                );
              }
            }

            static Future<Map<String, dynamic>> backup() async {
              final db = await database;

              return {
                'version': '6.4.0',
                'created': stamp(),
                'products': await db.query('products'),
                'users': await db.query('users'),
                'sales': await db.query('sales'),
                'sale_items': await db.query('sale_items'),
                'stock_logs': await db.query('stock_logs'),
              };
            }
          }

          class Product {
            final int id;
            final String name;
            final String category;
            final int price;
            final int stock;
            final bool active;

            Product({
              required this.id,
              required this.name,
              required this.category,
              required this.price,
              required this.stock,
              required this.active,
            });

            factory Product.fromMap(Map<String, dynamic> m) {
              return Product(
                id: m['id'] as int,
                name: m['name'] as String,
                category: m['category'] as String,
                price: m['price'] as int,
                stock: m['stock'] as int,
                active: m['active'] == 1,
              );
            }
          }

          class CartLine {
            final Product product;
            int qty;

            CartLine(this.product, this.qty);
          }

          class SaleModel {
            final int id;
            final String no;
            final String time;
            final String cashier;
            final int subtotal;
            final int discount;
            final int total;
            final int cash;
            final int change;
            final String payment;
            final bool returned;

            SaleModel({
              required this.id,
              required this.no,
              required this.time,
              required this.cashier,
              required this.subtotal,
              required this.discount,
              required this.total,
              required this.cash,
              required this.change,
              required this.payment,
              required this.returned,
            });

            factory SaleModel.fromMap(Map<String, dynamic> m) {
              return SaleModel(
                id: m['id'] as int,
                no: m['sale_no'] as String,
                time: m['sale_time'] as String,
                cashier: m['cashier'] as String,
                subtotal: m['subtotal'] as int,
                discount: m['discount'] as int,
                total: m['total'] as int,
                cash: m['cash'] as int,
                change: m['change_amount'] as int,
                payment: m['payment'] as String,
                returned: m['returned'] == 1,
              );
            }
          }

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await DB.database;
            runApp(const ColonelApp());
          }

          class ColonelApp extends StatelessWidget {
            const ColonelApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Colonel Fried Chicken POS V6.4',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: red),
                  scaffoldBackgroundColor: bg,
                  useMaterial3: true,
                  appBarTheme: const AppBarTheme(
                    backgroundColor: red,
                    foregroundColor: Colors.white,
                  ),
                ),
                home: const LoginPage(),
              );
            }
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});

            @override
            State<LoginPage> createState() => _LoginPageState();
          }

          class _LoginPageState extends State<LoginPage> {
            final user = TextEditingController();
            final pass = TextEditingController();

            Future<void> login() async {
              final u = await DB.login(user.text.trim(), pass.text);

              if (!mounted) return;

              if (u == null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Username atau password salah.'),
                  ),
                );
                return;
              }

              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => HomePage(
                    username: u['username'] as String,
                    role: u['role'] as String,
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 420),
                      child: Card(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Column(
                            children: [
                              const Icon(
                                Icons.restaurant,
                                size: 70,
                                color: red,
                              ),
                              const SizedBox(height: 10),
                              const Text(
                                'COLONEL FRIED CHICKEN',
                                style: TextStyle(
                                  fontSize: 21,
                                  fontWeight: FontWeight.bold,
                                ),
                                textAlign: TextAlign.center,
                              ),
                              const Text('POS V6.4'),
                              const SizedBox(height: 25),
                              TextField(
                                controller: user,
                                decoration: const InputDecoration(
                                  labelText: 'Username',
                                  prefixIcon: Icon(Icons.person),
                                  border: OutlineInputBorder(),
                                ),
                              ),
                              const SizedBox(height: 12),
                              TextField(
                                controller: pass,
                                obscureText: true,
                                decoration: const InputDecoration(
                                  labelText: 'Password',
                                  prefixIcon: Icon(Icons.lock),
                                  border: OutlineInputBorder(),
                                ),
                                onSubmitted: (_) => login(),
                              ),
                              const SizedBox(height: 18),
                              SizedBox(
                                width: double.infinity,
                                child: FilledButton(
                                  onPressed: login,
                                  style: FilledButton.styleFrom(
                                    backgroundColor: red,
                                  ),
                                  child: const Text('MASUK'),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class HomePage extends StatefulWidget {
            final String username;
            final String role;

            const HomePage({
              super.key,
              required this.username,
              required this.role,
            });

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            int index = 0;

            Future<void> logout() async {
              Navigator.pushAndRemoveUntil(
                context,
                MaterialPageRoute(builder: (_) => const LoginPage()),
                (_) => false,
              );
            }

            @override
            Widget build(BuildContext context) {
              final pages = [
                DashboardPage(username: widget.username),
                PosPage(cashier: widget.username),
                ReportPage(role: widget.role),
                if (widget.role == 'Administrator')
                  SettingsPage(username: widget.username),
              ];

              final titles = [
                'Dashboard',
                'Transaksi',
                'Laporan',
                if (widget.role == 'Administrator') 'Pengaturan',
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Text('${titles[index]} • ${widget.role}'),
                  actions: [
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: SafeArea(
                  child: IndexedStack(
                    index: index,
                    children: pages,
                  ),
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: index,
                  onDestinationSelected: (v) {
                    setState(() => index = v);
                  },
                  destinations: [
                    const NavigationDestination(
                      icon: Icon(Icons.dashboard_outlined),
                      selectedIcon: Icon(Icons.dashboard),
                      label: 'Dashboard',
                    ),
                    const NavigationDestination(
                      icon: Icon(Icons.point_of_sale_outlined),
                      selectedIcon: Icon(Icons.point_of_sale),
                      label: 'Transaksi',
                    ),
                    const NavigationDestination(
                      icon: Icon(Icons.analytics_outlined),
                      selectedIcon: Icon(Icons.analytics),
                      label: 'Laporan',
                    ),
                    if (widget.role == 'Administrator')
                      const NavigationDestination(
                        icon: Icon(Icons.settings_outlined),
                        selectedIcon: Icon(Icons.settings),
                        label: 'Admin',
                      ),
                  ],
                ),
              );
            }
          }

          class CopyrightFooter extends StatelessWidget {
            const CopyrightFooter({super.key});

            @override
            Widget build(BuildContext context) {
              return const Padding(
                padding: EdgeInsets.symmetric(vertical: 24),
                child: Column(
                  children: [
                    Text(
                      copyright1,
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 12),
                    ),
                    Text(
                      copyright2,
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 11),
                    ),
                  ],
                ),
              );
            }
          }

          class DashboardPage extends StatefulWidget {
            final String username;

            const DashboardPage({super.key, required this.username});

            @override
            State<DashboardPage> createState() => _DashboardPageState();
          }

          class _DashboardPageState extends State<DashboardPage> {
            int omzet = 0;
            int transaksi = 0;
            int item = 0;
            List<SaleModel> recent = [];

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              final all = await DB.sales();
              final now = DateTime.now();
              final start = DateTime(now.year, now.month, now.day);

              var om = 0;
              var tr = 0;

              for (final raw in all) {
                final s = SaleModel.fromMap(raw);
                final d = DateTime.tryParse(s.time);

                if (d != null && !d.isBefore(start) && !s.returned) {
                  om += s.total;
                  tr++;
                }
              }

              final db = await DB.database;
              final rows = await db.rawQuery('''
                SELECT COALESCE(SUM(si.qty),0) jumlah
                FROM sale_items si
                INNER JOIN sales s ON s.id=si.sale_id
                WHERE s.sale_time >= ?
                  AND s.returned=0
              ''', [start.toIso8601String()]);

              if (!mounted) return;

              setState(() {
                omzet = om;
                transaksi = tr;
                item = (rows.first['jumlah'] as num).toInt();
                recent = all.take(5).map(SaleModel.fromMap).toList();
              });
            }

            @override
            Widget build(BuildContext context) {
              return RefreshIndicator(
                onRefresh: load,
                child: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    const Text(
                      'COLONEL FRIED CHICKEN',
                      style: TextStyle(
                        fontSize: 22,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const Text('Ringkasan penjualan hari ini'),
                    const SizedBox(height: 16),
                    LayoutBuilder(
                      builder: (context, c) {
                        final width = c.maxWidth;
                        final cross = width > 700 ? 4 : 2;

                        return GridView.count(
                          crossAxisCount: cross,
                          shrinkWrap: true,
