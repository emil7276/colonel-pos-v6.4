            Future<void> authorizeReturn(SaleModel sale) async {
              final pass = TextEditingController();

              final ok = await showDialog<bool>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text('Otorisasi Retur Admin'),
                  content: TextField(
                    controller: pass,
                    obscureText: true,
                    decoration: const InputDecoration(
                      labelText: 'Password Admin',
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context, false),
                      child: const Text('Batal'),
                    ),
                    FilledButton(
                      onPressed: () async {
                        final admin = await DB.login(
                          'admin',
                          pass.text,
                        );

                        if (admin != null &&
                            admin['role'] == 'Administrator') {
                          if (context.mounted) {
                            Navigator.pop(context, true);
                          }
                        }
                      },
                      child: const Text('OTORISASI'),
                    ),
                  ],
                ),
              );

              if (ok != true) return;

              try {
                await DB.returnSale(sale.id, 'admin');

                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Retur berhasil. Stok dikembalikan.'),
                  ),
                );

                await load();
              } catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('$e')),
                );
              }
            }
          }

