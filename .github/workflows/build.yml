          class PosPage extends StatefulWidget {
            final String cashier;

            const PosPage({super.key, required this.cashier});

            @override
            State<PosPage> createState() => _PosPageState();
          }

          class _PosPageState extends State<PosPage> {
            List<Product> products = [];
            final List<CartLine> cart = [];
            String category = 'Semua';
            int discount = 0;

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              final raw = await DB.products();
              if (!mounted) return;
              setState(() {
                products = raw
                    .map(Product.fromMap)
                    .where((p) => p.active)
                    .toList();
              });
            }

            List<String> get categories {
              final x = <String>{'Semua'};
              x.addAll(products.map((p) => p.category));
              return x.toList();
            }

            int get subtotal =>
                cart.fold(0, (sum, x) => sum + x.product.price * x.qty);

            int get total => (subtotal - discount).clamp(0, 1 << 31);

            void add(Product p) {
              final found = cart.where((x) => x.product.id == p.id);

              if (found.isEmpty) {
                if (p.stock <= 0) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Stok ${p.name} habis.')),
                  );
                  return;
                }
                setState(() => cart.add(CartLine(p, 1)));
              } else {
                final line = found.first;
                if (line.qty >= p.stock) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      content: Text(
                        'Stok ${p.name} hanya ${p.stock}.',
                      ),
                    ),
                  );
                  return;
                }
                setState(() => line.qty++);
              }
            }

            void minus(CartLine line) {
              setState(() {
                line.qty--;
                if (line.qty <= 0) cart.remove(line);
              });
            }

            Future<void> discountDialog() async {
              final c = TextEditingController(
                text: discount == 0 ? '' : discount.toString(),
              );

              final value = await showDialog<int>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text('Diskon'),
                  content: TextField(
                    controller: c,
                    keyboardType: TextInputType.number,
                    decoration: const InputDecoration(
                      labelText: 'Nominal diskon',
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context),
                      child: const Text('Batal'),
                    ),
                    FilledButton(
                      onPressed: () {
                        Navigator.pop(
                          context,
                          int.tryParse(c.text) ?? 0,
                        );
                      },
                      child: const Text('Simpan'),
                    ),
                  ],
                ),
              );

              if (value != null) {
                setState(() {
                  discount = value.clamp(0, subtotal);
                });
              }
            }

            Future<void> payment() async {
              if (cart.isEmpty) return;

              final cashController = TextEditingController();
              String method = 'Tunai';

              final result = await showDialog<Map<String, dynamic>>(
                context: context,
                builder: (_) {
                  return StatefulBuilder(
                    builder: (context, setDialog) {
                      final cash =
                          int.tryParse(cashController.text) ?? 0;
                      final change =
                          method == 'Tunai' ? cash - total : 0;

                      return AlertDialog(
                        title: const Text('Pembayaran'),
                        content: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Text(
                              'TOTAL ${rp(total)}',
                              style: const TextStyle(
                                fontSize: 20,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 15),
                            DropdownButtonFormField<String>(
                              value: method,
                              items: const [
                                DropdownMenuItem(
                                  value: 'Tunai',
                                  child: Text('Tunai'),
                                ),
                                DropdownMenuItem(
                                  value: 'QRIS',
                                  child: Text('QRIS'),
                                ),
                              ],
                              onChanged: (v) {
                                if (v != null) {
                                  setDialog(() => method = v);
                                }
                              },
                              decoration: const InputDecoration(
                                labelText: 'Metode',
                              ),
                            ),
                            if (method == 'Tunai') ...[
                              const SizedBox(height: 10),
                              TextField(
                                controller: cashController,
                                keyboardType: TextInputType.number,
                                onChanged: (_) => setDialog(() {}),
                                decoration: const InputDecoration(
                                  labelText: 'Uang diterima',
                                ),
                              ),
                              const SizedBox(height: 8),
                              Text(
                                change >= 0
                                    ? 'Kembalian ${rp(change)}'
                                    : 'Uang kurang ${rp(-change)}',
                              ),
                            ],
                          ],
                        ),
                        actions: [
                          TextButton(
                            onPressed: () => Navigator.pop(context),
                            child: const Text('Batal'),
                          ),
                          FilledButton(
                            onPressed: () {
                              final c =
                                  int.tryParse(cashController.text) ?? 0;
                              if (method == 'Tunai' && c < total) {
                                return;
                              }
                              Navigator.pop(context, {
                                'method': method,
                                'cash': method == 'Tunai' ? c : total,
                                'change':
                                    method == 'Tunai' ? c - total : 0,
                              });
                            },
                            child: const Text('PROSES'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );

              if (result == null) return;

              try {
                final id = await DB.createSale(
                  cashier: widget.cashier,
                  items: cart,
                  subtotal: subtotal,
                  discount: discount,
                  total: total,
                  cash: result['cash'] as int,
                  change: result['change'] as int,
                  payment: result['method'] as String,
                );

                final db = await DB.database;
                final rows = await db.query(
                  'sales',
                  where: 'id=?',
                  whereArgs: [id],
                  limit: 1,
                );

                if (!mounted) return;

                setState(() {
                  cart.clear();
                  discount = 0;
                });

                if (rows.isNotEmpty) {
                  final sale = SaleModel.fromMap(rows.first);
                  await showDialog(
                    context: context,
                    builder: (_) => AlertDialog(
                      title: const Text('Transaksi Berhasil'),
                      content: Text(
                        '${sale.no}\nTotal ${rp(sale.total)}',
                      ),
                      actions: [
                        TextButton(
                          onPressed: () => Navigator.pop(context),
                          child: const Text('Tutup'),
                        ),
                        FilledButton(
                          onPressed: () async {
                            Navigator.pop(context);
                            await printReceipt(sale);
                          },
                          child: const Text('Cetak'),
                        ),
                      ],
                    ),
                  );
                }

                await load();
              } catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('$e')),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final filtered = category == 'Semua'
