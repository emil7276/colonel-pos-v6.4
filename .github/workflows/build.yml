          Future<String> storeAddress() async {
            final p = await SharedPreferences.getInstance();
            return p.getString('store_address') ?? '';
          }

          Future<String> storePhone() async {
            final p = await SharedPreferences.getInstance();
            return p.getString('store_phone') ?? '';
          }

          Future<void> printReceipt(SaleModel sale) async {
            final name = await storeName();
            final address = await storeAddress();
            final phone = await storePhone();
            final items = await DB.saleItems(sale.id);

            final doc = pw.Document();

            doc.addPage(
              pw.Page(
                build: (_) {
                  return pw.Column(
                    crossAxisAlignment:
                        pw.CrossAxisAlignment.center,
                    children: [
                      pw.Text(
                        name,
                        style: pw.TextStyle(
                          fontSize: 18,
                          fontWeight: pw.FontWeight.bold,
                        ),
                      ),
                      if (address.isNotEmpty) pw.Text(address),
                      if (phone.isNotEmpty) pw.Text(phone),
                      pw.SizedBox(height: 8),
                      pw.Text('NOTA PENJUALAN'),
                      pw.Divider(),
                      pw.Align(
                        alignment: pw.Alignment.centerLeft,
                        child: pw.Text(
                          '${sale.no}\n'
                          '${sale.time}\n'
                          'Kasir: ${sale.cashier}',
                        ),
                      ),
                      pw.SizedBox(height: 8),
                      ...items.map(
                        (i) => pw.Row(
                          mainAxisAlignment:
                              pw.MainAxisAlignment.spaceBetween,
                          children: [
                            pw.Expanded(
                              child: pw.Text(
                                '${i['name']} x${i['qty']}',
                              ),
                            ),
                            pw.Text(
                              rp(
                                (i['price'] as int) *
                                    (i['qty'] as int),
                              ),
                            ),
                          ],
                        ),
                      ),
                      pw.Divider(),
                      pw.Row(
                        mainAxisAlignment:
                            pw.MainAxisAlignment.spaceBetween,
                        children: [
                          pw.Text('Subtotal'),
                          pw.Text(rp(sale.subtotal)),
                        ],
                      ),
                      pw.Row(
                        mainAxisAlignment:
                            pw.MainAxisAlignment.spaceBetween,
                        children: [
                          pw.Text('Diskon'),
                          pw.Text(rp(sale.discount)),
                        ],
                      ),
                      pw.Row(
                        mainAxisAlignment:
                            pw.MainAxisAlignment.spaceBetween,
                        children: [
                          pw.Text(
                            'TOTAL',
                            style: pw.TextStyle(
                              fontWeight: pw.FontWeight.bold,
                            ),
                          ),
                          pw.Text(
                            rp(sale.total),
                            style: pw.TextStyle(
                              fontWeight: pw.FontWeight.bold,
                            ),
                          ),
                        ],
                      ),
                      pw.SizedBox(height: 6),
                      pw.Text('Pembayaran: ${sale.payment}'),
                      if (sale.payment == 'Tunai') ...[
                        pw.Text('Tunai: ${rp(sale.cash)}'),
                        pw.Text('Kembalian: ${rp(sale.change)}'),
                      ],
                      pw.SizedBox(height: 18),
                      pw.Text('Terima kasih'),
                      pw.SizedBox(height: 14),
                      pw.Text(
                        copyright1,
                        textAlign: pw.TextAlign.center,
                      ),
                      pw.Text(
                        copyright2,
                        textAlign: pw.TextAlign.center,
                      ),
                    ],
                  );
                },
              ),
            );

            await Printing.layoutPdf(
              onLayout: (_) async => doc.save(),
            );
          }

          class ReportPage extends StatefulWidget {
            final String role;

            const ReportPage({super.key, required this.role});

            @override
            State<ReportPage> createState() => _ReportPageState();
          }

          class _ReportPageState extends State<ReportPage> {
            String period = 'Hari Ini';
            int omzetNow = 0;
            int omzetPrevious = 0;
            List<SaleModel> sales = [];
            List<Map<String, dynamic>> best = [];
            List<Map<String, dynamic>> hours = [];
            List<Map<String, dynamic>> days = [];

            DateTimeRange range() {
              final now = DateTime.now();

              if (period == 'Bulan Ini') {
                return DateTimeRange(
                  start: DateTime(now.year, now.month),
                  end: DateTime(now.year, now.month + 1),
                );
              }

              if (period == 'Semua') {
                return DateTimeRange(
                  start: DateTime(2000),
                  end: DateTime(2100),
                );
              }

              if (period == 'Minggu Ini') {
                final start =
                    DateTime(now.year, now.month, now.day)
                        .subtract(Duration(days: now.weekday - 1));

                return DateTimeRange(
                  start: start,
                  end: start.add(const Duration(days: 7)),
                );
              }

              return DateTimeRange(
                start: DateTime(now.year, now.month, now.day),
                end: DateTime(now.year, now.month, now.day + 1),
              );
            }

            Future<void> load() async {
              final r = range();

              final all = await DB.sales();
              final b = await DB.bestSelling(r.start, r.end);
              final h = await DB.hourly(r.start, r.end);
              final d = await DB.daily(r.start, r.end);
              final om = await DB.omzet(r.start, r.end);

              DateTime previousStart;
              DateTime previousEnd;

              if (period == 'Bulan Ini') {
                previousStart =
                    DateTime(r.start.year, r.start.month - 1);
                previousEnd = r.start;
              } else if (period == 'Tahun Ini') {
                previousStart = DateTime(r.start.year - 1);
                previousEnd = DateTime(r.start.year);
              } else {
                previousStart = r.start.subtract(
                  r.end.difference(r.start),
                );
                previousEnd = r.start;
              }

              final prev =
                  await DB.omzet(previousStart, previousEnd);

              if (!mounted) return;

              setState(() {
                sales = all.map(SaleModel.fromMap).toList();
                best = b;
                hours = h;
                days = d;
                omzetNow = om;
                omzetPrevious = prev;
              });
            }

            @override
            void initState() {
              super.initState();
              load();
            }

            @override
            Widget build(BuildContext context) {
              return RefreshIndicator(
                onRefresh: load,
                child: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      children: [
                        const Expanded(
                          child: Text(
                            'Laporan & Analitik',
                            style: TextStyle(
                              fontSize: 22,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ),
                        DropdownButton<String>(
                          value: period,
                          items: const [
                            DropdownMenuItem(
                              value: 'Hari Ini',
                              child: Text('Hari Ini'),
                            ),
                            DropdownMenuItem(
                              value: 'Minggu Ini',
                              child: Text('Minggu Ini'),
                            ),
                            DropdownMenuItem(
                              value: 'Bulan Ini',
                              child: Text('Bulan Ini'),
                            ),
                            DropdownMenuItem(
                              value: 'Semua',
                              child: Text('Semua'),
                            ),
                          ],
                          onChanged: (v) {
                            if (v != null) {
                              setState(() => period = v);
                              load();
                            }
                          },
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    Card(
                      child: ListTile(
                        leading: const Icon(
                          Icons.payments,
                          color: red,
                        ),
                        title: Text('Omzet $period'),
                        subtitle: Text(
                          'Periode sebelumnya: ${rp(omzetPrevious)}',
                        ),
                        trailing: Text(
                          rp(omzetNow),
                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                            fontSize: 18,
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 16),
                    analysisCard(
                      'Menu Terlaris',
                      best.isEmpty
                          ? const [Text('Belum ada data.')]
                          : best.take(10).map((x) {
                              return ListTile(
                                dense: true,
                                title: Text(x['name'].toString()),
                                leading: Text(
                                  '${x['qty']}x',
                                  style: const TextStyle(
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                                trailing: Text(
                                  rp(x['omzet'] as num),
                                ),
                              );
                            }).toList(),
                    ),
                    analysisCard(
                      'Jam Paling Ramai',
                      hours.isEmpty
                          ? const [Text('Belum ada data.')]
                          : hours.take(10).map((x) {
                              return ListTile(
                                dense: true,
                                title: Text('${x['jam']}:00'),
                                trailing: Text(
                                  '${x['transaksi']} transaksi',
                                ),
                              );
                            }).toList(),
                    ),
                    analysisCard(
                      'Hari Paling Ramai',
                      days.isEmpty
                          ? const [Text('Belum ada data.')]
                          : days.take(10).map((x) {
                              return ListTile(
                                dense: true,
                                title: Text(x['tanggal'].toString()),
                                trailing: Text(
                                  '${x['transaksi']} transaksi',
                                ),
                              );
                            }).toList(),
                    ),
                    const SizedBox(height: 12),
                    const Text(
                      'Perbandingan Periode',
                      style: TextStyle(
                        fontWeight: FontWeight.bold,
                        fontSize: 18,
